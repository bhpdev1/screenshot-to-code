[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["Abi Raja <abimanyuraja@gmail.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
# starlette>=1.3.1 (CVE-2026-54283, CVE-2026-48818, CVE-2025-62727) needs fastapi>=0.133.
# <0.142: fastapi 0.142+ requires opentelemetry-api>=1.44, which would drag the langfuse OTel stack and protobuf 7.
fastapi = ">=0.133.0,<0.142.0"
uvicorn = "^0.25.0"
websockets = "^14.1"
openai = "2.16.0"
python-dotenv = "^1.0.0"
beautifulsoup4 = "^4.12.2"
httpx = "^0.28.1"
pre-commit = "^3.6.2"
anthropic = "^0.84.0"
moviepy = "^1.0.3"
pillow = [
    { version = "^13.0.0", python = ">=3.11" },
    { version = "^12.3.0", python = ">=3.10,<3.11" },
]
types-pillow = "^10.2.0.20240520"
aiohttp = "^3.9.5"
pydantic = "^2.10"
google-genai = "^1.16.1"
langfuse = "^3.0.2"
playwright = "^1.61.0"
pillow-heif = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pyright = "^1.1.352"
pytest-asyncio = "^0.21"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
